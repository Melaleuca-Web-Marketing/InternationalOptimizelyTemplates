<div id="optimizely-extension-{{ extension.$instance }}" class="{{ extension.hideInMobile }}">
  <article style="background-color: {{ extension.backgroundColor }};">
    <a href="{{ extension.link }}">
      <div class="py-10 sm:py-20 px-24 sm:px-60 md:px-40 mx-auto flex flex-row {{ extension.horizontalAlignment }}" style="max-width: 1170px;">
        {{{ extension.description }}}
      </div>
    </a>
  </article>
</div>
